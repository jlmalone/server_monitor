name: Bug report
description: Report a reproducible Server Monitor failure.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove private machine details, paths, and credentials before submitting diagnostics.
  - type: input
    id: version
    attributes:
      label: Server Monitor version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Service lifecycle
        - Health monitoring
        - Optional status panel
        - Infrastructure supervision
        - Installation or upgrade
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Sanitized diagnostics
      description: Include only relevant output with private values removed.
