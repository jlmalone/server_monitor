name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: ./tests/test-background-registration-stamp.sh
      - run: ./tests/test-resource-guard-policy.sh
      - run: ./tests/test-infrastructure-agent-watchdog.sh
      - run: ./tests/test-monitor-health.sh
      - run: ./tests/test-network-posture.sh
      - name: Build native app
        run: |
          xcodebuild \
            -project app/ServerMonitor/ServerMonitor.xcodeproj \
            -scheme ServerMonitor \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO \
            build

  cli:
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run lint
      - run: npm test
